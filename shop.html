<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فروشگاه | عرشیا دانش‌آرا</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* استایل اختصاصی صفحه فروشگاه */
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #f0f4f1;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }
    .shop-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .shop-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .shop-header h1 {
      color: #16a34a;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .shop-header p {
      color: #64748b;
      font-size: 1.1rem;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      justify-content: center;
    }
    .product-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 30px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .product-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }
    .product-title {
      color: #1e293b;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .product-desc {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .btn-download {
      display: inline-block;
      padding: 12px 24px;
      background: #f97316; /* رنگ نارنجی برای HTML */
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .btn-download:hover {
      background: #ea580c;
    }
    .back-nav {
      text-align: center;
      margin-top: 50px;
    }
    .back-nav a {
      color: #16a34a;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="shop-container">
    <header class="shop-header">
      <h1>🛍️ فروشگاه برنامه‌ها</h1>
      <p>برنامه‌های آموزشی ساخته شده توسط عرشیا دانش‌آرا</p>
    </header>

    <div class="product-grid">
      
      <!-- کارت دوره HTML -->
      <div class="product-card">
        <div>
          <div class="product-icon">🌐</div>
          <h2 class="product-title">دوره آموزش HTML</h2>
          <p class="product-desc">
            یادگیری زبان پایه وب برای ساخت صفحات سایت. این برنامه شامل درس‌های تعاملی، تمرین و محیط کدنویسی است.
          </p>
        </div>
        
        <!-- لینک دانلود رو به زودی اینجا میذاری -->
        <a href="#" class="btn-download" target="_blank">⬇️ دانلود برنامه (Windows)</a>
      </div>

    </div>

    <div class="back-nav">
      <a href="index.html">⬅ بازگشت به صفحه اصلی</a>
    </div>
  </div>

</body>
</html>
